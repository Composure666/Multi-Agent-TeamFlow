# Multi-Agent TeamFlow Nginx 反向代理
#
# 安装位置：/etc/nginx/conf.d/agenthub.conf
# 启用：  sudo nginx -t && sudo systemctl reload nginx
#
# 设计要点：
#   1) Multi-Agent TeamFlow 主服务只听 127.0.0.1:3000，公网入口只有 Nginx —— 端口不直接暴露。
#   2) 默认开启 HTTP Basic 鉴权。这不是可选项：
#      本服务通过 node-pty 提供可交互 shell，未鉴权暴露到公网 = 把服务器交出去。
#   3) SSE / 流式响应必须关 proxy_buffering，否则前端会「卡着不出字」。

upstream agenthub_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# 这个 map 必须存在，否则 $connection_upgrade 未定义，nginx -t 会直接报错。
# conf.d/*.conf 是被 include 进 http 块的，所以写在文件顶层就是 http 上下文。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------------
# gzip：Next.js 的 JSON 响应体积很大（消息列表可到 1.5MB、run 调试事件 1.6MB、
# 图标 SVG 360KB）。不压缩 = 每次页面刷新都在公网裸传好几 MB，用户侧的感受
# 就是「每个模块的数据刷新都很慢」。
#
# ⚠️ 三个必须点，少一个都不生效：
#   1) gzip_types 必须显式列出 application/json —— nginx 默认只压 text/html；
#   2) gzip_proxied any —— 默认 off 时由 proxy_pass 反代回来的响应一律不压；
#   3) 刻意**不列** text/event-stream —— SSE 一旦被压缩就会攒缓冲，
#      前端表现为「卡着不出字」。这是本项目 SSE 的命门，别加。
#
# 注：`gzip on;` 已由 /etc/nginx/nginx.conf 在 http 块打开，这里不要再写一遍
#     （同一个上下文重复声明 gzip 会让 nginx -t 直接报 duplicate）。
gzip_proxied any;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml
    application/rss+xml
    image/svg+xml;

server {
    listen 80;
    listen [::]:80;

    # 有域名就换成你的域名；没有就先留 _ 用公网 IP 访问
    server_name _;

    # ------------------------------------------------------------------
    # 上传上限：Multi-Agent TeamFlow 支持工作区文件上传、产物回传
    client_max_body_size 200M;

    # Agent 长任务：一次请求可能跑几十分钟，超时给足
    proxy_connect_timeout 60s;
    proxy_send_timeout    3600s;
    proxy_read_timeout    3600s;

    # 必须关缓冲：SSE（运行日志 / 调试面板实时流）靠它才能逐条推送
    proxy_buffering off;
    proxy_request_buffering off;

    # --------------------------------------------------------------
    # 鉴权门槛
    #   生成密码文件：sudo htpasswd -c /etc/nginx/.htpasswd 你的用户名
    #   追加用户：    sudo htpasswd /etc/nginx/.htpasswd 另一个用户名
    #   想临时关闭：  注释掉下面两行（确认你已用其他方式限制访问，例如安全组白名单）
    auth_basic           "Multi-Agent TeamFlow";
    auth_basic_user_file /etc/nginx/.htpasswd;
    # --------------------------------------------------------------

    location / {
        proxy_pass http://agenthub_backend;
        proxy_http_version 1.1;

        # WebSocket / SSE 透传
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # 双保险：有些中间层不看 nginx 的缓冲开关，只认这个响应头
        proxy_set_header X-Accel-Buffering no;

        proxy_redirect off;
    }

    # Next.js 静态资源带内容哈希，可以放心长缓存
    # （只加响应头即可，不配 proxy_cache —— 没定义 proxy_cache_path 时 proxy_cache_valid 是空转）
    location /_next/static/ {
        proxy_pass http://agenthub_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
        # 静态资源不设鉴权，省一次密码校验，也避免 <img>/<script> 触发认证弹窗
        auth_basic off;
    }

    # 产物图片可能很大且数量多，单独放宽超时
    location /api/artifact-images/ {
        proxy_pass http://agenthub_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }
}

