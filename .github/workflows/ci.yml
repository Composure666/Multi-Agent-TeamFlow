# Multi-Agent TeamFlow CI
#
# 目的：让每一次 push / PR 都有明确的绿红反馈 —— 类型、Lint、构建必须过；
# 单测跑但不阻塞（原因写在下面 test 步骤的注释里，不是偷懒，是有据可查的既存失败）。
#
# ⚠️ 两个版本硬约束，改了 CI 会莫名其妙地红：
#   1) Node 必须 24。better-sqlite3 是原生模块，Node 22 下 ABI 不匹配，
#      症状是 `ERR_DLOPEN_FAILED` / `NODE_MODULE_VERSION 137 vs 127`，
#      看起来像代码错，其实只是 ABI。
#   2) 必须用 pnpm（package.json 的 packageManager = pnpm@11.9.0），
#      且 pnpm-workspace.yaml 里的 allowBuilds 允许了 better-sqlite3 / electron / node-pty
#      等原生模块的构建 —— pnpm 10+ 默认拦掉这些 postinstall，少了它们构建会缺件。
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 类型 · Lint · 单测 · 构建
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查（Next 侧）
        run: pnpm typecheck

      - name: 类型检查（Electron 主进程）
        # electron/ 被根 tsconfig 排除在外，必须单独过一遍，
        # 否则 `pnpm typecheck` 全绿也照样可能构建不出桌面端。
        run: pnpm exec tsc -p electron/tsconfig.json --noEmit

      - name: Lint
        run: pnpm lint

      - name: 单元测试
        # ❗❗ 必须排在「生产构建」之前，顺序不能换。
        # `pnpm build` 会先跑 `sqlite:ensure:electron`，把 better-sqlite3 的原生二进制
        # 换成 **Electron ABI**；之后 `pnpm test`（内含 `sqlite:ensure:node`）检测到 ABI 不符
        # 会尝试 `pnpm rebuild better-sqlite3` 换回 Node ABI，但 CI 上 prebuild-install
        # 0.1 秒就返回「Done」且**没有真正替换掉那份 Electron 二进制** —— 于是 Node 加载
        # Electron ABI 的 .node 直接 `Segmentation fault (core dumped)`（exit 139）。
        # 实测：构建在前、单测在后 ⇒ 单测必崩；单测在前 ⇒ 用安装时那份 Node ABI，正常跑完。
        # （曾经给它挂了 continue-on-error，结果段错误被粉饰成绿灯 —— 绿灯必须真绿。）
        run: pnpm test

      - name: 生产构建
        # 重试一次：next build 在「Collecting page data」阶段会起多个 worker 并发
        # import 路由模块、各自跑一次 bootstrapDatabase，多进程并发写同一个 WAL 库
        # 偶发 `SqliteError: attempt to write a readonly database`（失败页面还不固定）。
        # 重跑一次必过，属于并发抖动而非回归。
        run: pnpm build || pnpm build
